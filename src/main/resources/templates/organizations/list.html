<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Organizations</title>
</head>
<body>
    <h1>Organizations</h1>
    <a href="/ui/organizations/new">Add New Organization</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Email</th>
                <th>URL</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="organization : ${organizations}">
                <td th:text="${organization.id}"></td>
                <td th:text="${organization.name}"></td>
                <td th:text="${organization.description}"></td>
                <td th:text="${organization.email}"></td>
                <td th:text="${organization.url}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
