<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Locations</title>
</head>
<body>
    <h1>Locations</h1>
    <a href="/ui/locations/new">Add New Location</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Address</th>
                <th>City</th>
                <th>Postal Code</th>
                <th>Country</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="location : ${locations}">
                <td th:text="${location.id}"></td>
                <td th:text="${location.name}"></td>
                <td th:text="${location.address1}"></td>
                <td th:text="${location.city}"></td>
                <td th:text="${location.postalCode}"></td>
                <td th:text="${location.country}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
